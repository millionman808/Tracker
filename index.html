<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#7bc47f" />
  <title>Nibble — Sprout Snacks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="app" class="app">
    <!-- Screens are rendered into here by js/app.js -->
    <main id="screen" class="screen" aria-live="polite"></main>

    <!-- Bottom navigation -->
    <nav class="tabbar" id="tabbar" aria-label="Main navigation">
      <button class="tab" data-screen="home" aria-label="Home">
        <span class="tab__icon" aria-hidden="true">🏡</span>
        <span class="tab__label">Home</span>
      </button>
      <button class="tab" data-screen="today" aria-label="Today's log">
        <span class="tab__icon" aria-hidden="true">📋</span>
        <span class="tab__label">Today</span>
      </button>
      <button class="tab tab--center" data-screen="log" aria-label="Log food">
        <span class="tab__plus" aria-hidden="true">+</span>
      </button>
      <button class="tab" data-screen="shop" aria-label="Shop and decorate">
        <span class="tab__icon" aria-hidden="true">🛍️</span>
        <span class="tab__label">Shop</span>
      </button>
      <button class="tab" data-screen="stats" aria-label="Stats and progress">
        <span class="tab__icon" aria-hidden="true">📈</span>
        <span class="tab__label">Stats</span>
      </button>
    </nav>
  </div>

  <!-- Floating toast for gentle feedback -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Modal host -->
  <div id="modal-root"></div>

  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/sprout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
