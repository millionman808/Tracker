# XcodeGen spec — OPTIONAL fallback.
#
# The committed Nibble.xcodeproj already opens and builds in Xcode 15+, so you
# normally do NOT need this. It's here only if you'd prefer to regenerate the
# project from scratch (e.g. on an older Xcode, or to customise settings):
#
#   brew install xcodegen
#   cd ios/Nibble
#   xcodegen generate
#
name: Nibble
options:
  bundleIdPrefix: com.nibble
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Nibble:
    type: application
    platform: iOS
    sources:
      - Nibble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nibble.sproutsnacks
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: true
